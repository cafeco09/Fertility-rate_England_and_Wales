name: Generate source-driven fertility chart

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Show repository files
        run: |
          echo "Current repo files:"
          ls -la

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib requests beautifulsoup4 lxml openpyxl

      - name: Create output folders
        run: |
          mkdir -p data/raw
          mkdir -p data/processed
          mkdir -p graph

      - name: Generate chart from original source data
        run: |
          test -f plot_from_original_sources.py || (echo "Missing plot_from_original_sources.py in repo root" && exit 1)
          python plot_from_original_sources.py

      - name: Check generated files
        run: |
          test -f graph/birthrate_social_media_chart_zero_scale.png
          test -f data/processed/fertility_social_media_2020_2024.csv

      - name: Upload generated chart
        uses: actions/upload-artifact@v4
        with:
          name: fertility-social-media-zero-scale-chart
          path: graph/birthrate_social_media_chart_zero_scale.png

      - name: Upload processed dataset
        uses: actions/upload-artifact@v4
        with:
          name: fertility-social-media-processed-data
          path: data/processed/fertility_social_media_2020_2024.csv

      - name: Commit generated source extracts, data and chart
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed graph/birthrate_social_media_chart_zero_scale.png
          git commit -m "Generate chart from original source data" || echo "No changes to commit"
          git push
