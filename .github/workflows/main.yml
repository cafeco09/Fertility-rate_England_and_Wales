name: Generate fertility plot

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib requests beautifulsoup4

      - name: Create folders
        run: |
          mkdir -p data/raw
          mkdir -p data/processed
          mkdir -p plots

      - name: Generate source-backed plot
        run: |
          cat > generate_plot.py <<'PY'
          from pathlib import Path
          import re
          import requests
          import pandas as pd
          import matplotlib.pyplot as plt
          from bs4 import BeautifulSoup

          RAW_DIR = Path("data/raw")
          PROCESSED_DIR = Path("data/processed")
          PLOTS_DIR = Path("plots")

          RAW_DIR.mkdir(parents=True, exist_ok=True)
          PROCESSED_DIR.mkdir(parents=True, exist_ok=True)
          PLOTS_DIR.mkdir(parents=True, exist_ok=True)

          ONS_SOURCE_URL = "https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/livebirths/bulletins/birthsummarytablesenglandandwales/2024refreshedpopulations"

          DATAREPORTAL_REPORTS = {
              2020: "https://datareportal.com/reports/digital-2020-united-kingdom",
              2021: "https://datareportal.com/reports/digital-2021-united-kingdom",
              2022: "https://datareportal.com/reports/digital-2022-united-kingdom",
              2023: "https://datareportal.com/reports/digital-2023-united-kingdom",
              2024: "https://datareportal.com/reports/digital-2024-united-kingdom",
          }

          # ONS source-backed values from the Births in England and Wales releases.
          # The raw ONS source page is saved below for auditability.
          fertility_data = pd.DataFrame({
              "year": [2020, 2021, 2022, 2023, 2024],
              "england_wales_total_fertility_rate": [1.58, 1.61, 1.49, 1.42, 1.41],
              "fertility_source": [ONS_SOURCE_URL] * 5
          })

          def fetch_text(url):
              headers = {"User-Agent": "Mozilla/5.0 fertility-social-media-plot"}
              response = requests.get(url, headers=headers, timeout=60)
              response.raise_for_status()
              return response.text

          # Save ONS source page
          ons_html = fetch_text(ONS_SOURCE_URL)
          (RAW_DIR / "ons_births_2024_refreshed_populations.html").write_text(
              ons_html,
              encoding="utf-8"
          )

          def extract_social_media_users(text, year):
              patterns = [
                  rf"There were\s+([0-9]+(?:\.[0-9]+)?)\s+million\s+social media users\s+in\s+the\s+United Kingdom\s+in\s+January\s+{year}",
                  rf"The UK was home to\s+([0-9]+(?:\.[0-9]+)?)\s+million\s+social media users\s+in\s+January\s+{year}",
                  rf"([0-9]+(?:\.[0-9]+)?)\s+million\s+social media users\s+in\s+the\s+United Kingdom\s+in\s+January\s+{year}",
              ]

              for pattern in patterns:
                  match = re.search(pattern, text, flags=re.IGNORECASE)
                  if match:
                      return float(match.group(1))

              raise ValueError(f"Could not extract social media users for {year}")

          social_rows = []

          for year, url in DATAREPORTAL_REPORTS.items():
              html = fetch_text(url)
              raw_path = RAW_DIR / f"datareportal_{year}.html"
              raw_path.write_text(html, encoding="utf-8")

              soup = BeautifulSoup(html, "html.parser")
              text = soup.get_text(" ", strip=True)

              users_millions = extract_social_media_users(text, year)

              social_rows.append({
                  "year": year,
                  "uk_social_media_users_millions": users_millions,
                  "social_media_source": url
              })

          social_data = pd.DataFrame(social_rows)

          df = fertility_data.merge(social_data, on="year", how="inner")
          df = df.sort_values("year")

          processed_path = PROCESSED_DIR / "fertility_social_media_2020_2024.csv"
          df.to_csv(processed_path, index=False)

          print("Processed data:")
          print(df.to_string(index=False))

          years = df["year"]
          fertility_rate = df["england_wales_total_fertility_rate"]
          social_media_users = df["uk_social_media_users_millions"]

          fig, ax1 = plt.subplots(figsize=(12, 8), dpi=200)

          line1 = ax1.plot(
              years,
              fertility_rate,
              marker="o",
              linewidth=3,
              label="Fertility rate"
          )

          ax1.set_xlabel("Year", fontsize=12)
          ax1.set_ylabel("Total fertility rate (children per woman)", fontsize=12)
          ax1.set_ylim(0, 2.0)
          ax1.set_xticks(years)
          ax1.grid(True, axis="y", alpha=0.25)

          for x, y in zip(years, fertility_rate):
              ax1.annotate(
                  f"{y:.2f}",
                  (x, y),
                  textcoords="offset points",
                  xytext=(0, 8),
                  ha="center",
                  fontsize=10
              )

          ax2 = ax1.twinx()

          line2 = ax2.plot(
              years,
              social_media_users,
              marker="s",
              linewidth=3,
              linestyle="--",
              label="Social media users"
          )

          ax2.set_ylabel("UK social media users (millions)", fontsize=12)
          ax2.set_ylim(0, 60)

          for x, y in zip(years, social_media_users):
              ax2.annotate(
                  f"{y:.1f}m",
                  (x, y),
                  textcoords="offset points",
                  xytext=(0, -18),
                  ha="center",
                  fontsize=10
              )

          fig.suptitle(
              "Rising social media use, falling fertility",
              fontsize=18,
              fontweight="bold",
              y=0.96
          )

          ax1.set_title(
              "Zero-baseline view: UK social media users vs England & Wales total fertility rate, 2020–2024",
              fontsize=12,
              pad=16
          )

          lines = line1 + line2
          labels = [line.get_label() for line in lines]
          ax1.legend(lines, labels, loc="upper right", frameon=False)

          fig.text(
              0.08,
              0.06,
              "Interpretation: this zero-baseline version is less visually dramatic. It still shows fertility falling while\n"
              "social media use remains high, but it avoids overstating the size of the fertility movement.",
              fontsize=10
          )

          fig.text(
              0.08,
              0.02,
              "Sources: ONS Births in England and Wales; DataReportal UK Digital reports 2020–2024.",
              fontsize=9
          )

          plt.tight_layout(rect=[0.04, 0.1, 0.96, 0.92])

          output_path = PLOTS_DIR / "fertility_social_media_zero_scale.png"
          plt.savefig(output_path, bbox_inches="tight")

          print(f"Saved plot to {output_path}")
          PY

          python generate_plot.py

      - name: Check generated files
        run: |
          ls -la
          ls -la plots
          ls -la data/processed
          test -f plots/fertility_social_media_zero_scale.png
          test -f data/processed/fertility_social_media_2020_2024.csv

      - name: Upload generated plot
        uses: actions/upload-artifact@v4
        with:
          name: fertility-social-media-zero-scale-plot
          path: plots/fertility_social_media_zero_scale.png

      - name: Upload processed dataset
        uses: actions/upload-artifact@v4
        with:
          name: fertility-social-media-processed-data
          path: data/processed/fertility_social_media_2020_2024.csv

      - name: Commit generated source files, data and plot
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed plots/fertility_social_media_zero_scale.png
          git commit -m "Generate fertility social media plot" || echo "No changes to commit"
          git push
