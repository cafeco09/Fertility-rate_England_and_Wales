name: Generate fertility chart

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib

      - name: Run chart script
        run: |
          python plot_birthrate_social_media.py

      - name: Upload generated chart
        uses: actions/upload-artifact@v4
        with:
          name: fertility-social-media-chart
          path: birthrate_social_media_chart.png
